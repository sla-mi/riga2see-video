<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8">
<title>Нотная дорожка</title>
<style>
:root{--bg:#0f1114;--panel:#1a1d23;--grid:#2a2f38;--grid2:#20242b;--text:#e9e6df;--muted:#8b93a1;--accent:#e9a23b;--accent-soft:rgba(233,162,59,.25);--line:#f4f4f4;--good:#46b36d;--near:#d4c13c;--flat:#5b8def;--sharp:#e5544d;--btn:#e9e6df;--btnfg:#14171c;--chip:#252a33;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--panel:#1d2128;--grid:#2a2f38;--grid2:#20242b;--text:#e9e6df;--muted:#8b93a1;--accent:#e9a23b;--accent-soft:rgba(233,162,59,.25);--line:#f4f4f4;--good:#46b36d;--flat:#5b8def;--sharp:#e5544d;--btn:#e9e6df;--btnfg:#14171c;--chip:#252a33}}
:root[data-theme="dark"]{--bg:#14171c;--panel:#1d2128;--grid:#2a2f38;--grid2:#20242b;--text:#e9e6df;--muted:#8b93a1;--accent:#e9a23b;--accent-soft:rgba(233,162,59,.25);--line:#f4f4f4;--good:#46b36d;--flat:#5b8def;--sharp:#e5544d;--btn:#e9e6df;--btnfg:#14171c;--chip:#252a33}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;padding:10px 16px;padding-block:10px;display:flex;flex-direction:column;gap:10px;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em}
h1 small{color:var(--muted);font-weight:400;margin-left:6px}
label.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
select,input[type=range]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:5px 8px}
input[type=range]{width:90px;padding:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.ghost{background:var(--chip);color:var(--text)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:relative;flex:1;min-height:300px;background:var(--panel);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#live{display:none;position:absolute;right:12px;top:10px;font-size:22px;font-weight:700;padding:4px 12px;border-radius:10px;background:var(--chip);min-width:74px;text-align:center}
#meter{position:absolute;left:12px;bottom:10px;width:120px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--good)}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:20px;color:var(--muted);pointer-events:none}
#lyrics{display:none}
#lyrics b{color:var(--accent)}
#result{display:none;flex-direction:column;gap:8px;padding:10px 12px;background:var(--panel);border-radius:14px}
#result.show{display:flex}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.stats b{color:var(--text);font-size:18px}
.stats em{font-style:normal;color:var(--good);font-size:14px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 7px;border-radius:7px;font-size:13px;line-height:1.15;text-align:center;background:var(--chip)}
.chip small{display:block;font-size:10px;opacity:.85}
#scrubrow{display:flex;align-items:center;gap:8px;position:absolute;left:12px;right:12px;top:8px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--panel) 85%,transparent)}
#scrubrow[hidden]{display:none}
#scrubrow input[type=range]{flex:1;width:auto}
#scrubrow span{color:var(--muted);font-size:13px;min-width:56px;text-align:right}
#scrubrow button{padding:6px 12px}
.chip{cursor:pointer}
.chip.cur{outline:2px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style></head><body>
<header>
  <h1>Нотная дорожка</h1>
  <label class="ctl">песня <select id="song"></select></label>
  <select id="section" hidden><option value="all">вся песня</option></select>
  <label class="ctl">минус <select id="backing"><option value="synth" selected>аккомпанемент</option><option value="guitar">своя гитара (запись)</option><option value="none">только мелодия</option></select></label>
  <label class="ctl">тональность <select id="tr"></select></label>
  <label class="ctl">темп <select id="tempo"><option value="84" id="tempoSong">84 (песня)</option><option value="70">70</option><option value="60">60</option><option value="50">50</option></select></label>
  <span class="ctl">громкость:</span>
  <label class="ctl">мелодия <input id="vol" type="range" min="0" max="100" value="60"></label>
  <label class="ctl">аккомпанемент <input id="chvol" type="range" min="0" max="100" value="55"></label>
  <input id="btvol" type="range" min="0" max="100" value="40" hidden>
  <label class="ctl" hidden>задержка <select id="lat"><option value="0">0 мс</option><option value="100">100</option><option value="150">150</option><option value="200">200</option><option value="250">250</option><option value="300">300</option></select></label>
  <input id="loop" type="checkbox" hidden>
  <label class="ctl">микрофон <select id="mic"><option value="">по умолчанию</option></select></label>
  <label class="ctl">наушники <select id="spk"><option value="">по умолчанию</option></select></label>
  <button id="start">Старт</button>
  <button id="mictest" class="ghost">Проверить микрофон</button>
  <button id="sndtest" class="ghost" title="Секунда тона без микрофона — проверить, куда играет звук">Тест звука</button>
  <button id="stop" class="ghost" hidden>Стоп</button>
</header>
<audio id="gtr" preload="auto"></audio>   <!-- минус-запись песни (адрес в songs/*.json → gtr.url; лежит на R2: там верный тип и перемотка) -->
<div id="stage"><canvas id="cv"></canvas><div id="scrubrow" hidden><button id="prev" class="ghost" title="← предыдущий слог">◀</button><input id="scrub" type="range" min="0" max="1000" value="0"><button id="next" class="ghost" title="→ следующий слог">▶</button><span id="scrubT">0.0 с</span></div><div id="live">—</div><div id="meter"><i></i></div><div id="msg">Нажми «Старт» или пробел, разреши микрофон. 4 щелчка — и поехали. Пробел — стоп.</div></div>
<div id="lyrics"></div>
<div id="result">
  <div class="stats"><span>в ±25 ц <b id="rIn10">—</b> <em id="rLvl"></em></span><span>почти <b id="rIn25">—</b></span><span>мимо <b id="rMiss">—</b></span><span>слогов <b id="rN">0</b></span><span>ниже <b id="rLow">—</b></span><span>выше <b id="rHigh">—</b></span></div>
  <div class="legend"><span><i style="background:var(--good)"></i>попал (±25)</span><span><i style="background:var(--near)"></i>почти (±40)</span><span><i style="background:var(--flat)"></i>ниже</span><span><i style="background:var(--sharp)"></i>выше</span><span><i style="background:var(--chip);border:1px solid var(--grid)"></i>нет голоса</span></div>
  <div class="chips" id="chips"></div>
  <div id="hist" class="stats"></div>
</div>

    $('hist').innerHTML=same.length>1?'<span>раньше:</span>'+same.slice(1).map(h=>{const dt=new Date(h.d);return '<span title="'+dt.toLocaleString('ru')+'">'+dt.toLocaleDateString('ru',{day:'numeric',month:'short'})+' <b>'+Math.round(100*h.good/h.n)+'%</b>+'+Math.round(100*h.near/h.n)+'%</span>';}).join(''):'';}catch(e){}}
// просмотр после пения: перемотка
function setRT(v){rt=Math.max(0,Math.min(total,v));$('scrub').value=total?Math.round(rt/total*1000):0;$('scrubT').textContent=rt.toFixed(1)+' с';
  const tg=targetAt(rt);for(const e of events)if(e.chip)e.chip.classList.toggle('cur',e===tg);draw(rt);}
function stepSyl(dir){const ts=events.map(e=>e.t);let v;if(dir>0)v=ts.find(x=>x>rt+0.05);else{const p=ts.filter(x=>x<rt-0.05);v=p.length?p[p.length-1]:0;}if(v==null)v=total;setRT(v);}
$('scrub').addEventListener('input',()=>setRT(+$('scrub').value/1000*total));
$('prev').onclick=()=>stepSyl(-1);$('next').onclick=()=>stepSyl(1);
(function(){let dx=null,r0=0;const st=$('stage');
  st.addEventListener('pointerdown',e=>{if(!review)return;dx=e.clientX;r0=rt;st.setPointerCapture(e.pointerId);});
  st.addEventListener('pointermove',e=>{if(dx==null)return;setRT(r0-(e.clientX-dx)/PPS);});
  const up=()=>{dx=null;};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);})();
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();
  if(e.code==='Space'){e.preventDefault();if(document.activeElement)document.activeElement.blur();if(running||testing)stop(false);else start();return;}
  if(!review||tag==='select'||tag==='input')return;
  if(e.code==='ArrowLeft'){e.preventDefault();e.shiftKey?setRT(rt-0.25):stepSyl(-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();e.shiftKey?setRT(rt+0.25):stepSyl(1);}
  else if(e.code==='Home'){e.preventDefault();setRT(0);}else if(e.code==='End'){e.preventDefault();setRT(total);}});
// выбор песни
Object.keys(SONGS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=SONGS[k].title+' · '+SONGS[k].artist;$('song').appendChild(o);});
(function(){const t=$('tr');for(let i=-6;i<=6;i++){const o=document.createElement('option');o.value=i;t.appendChild(o);}
  t.addEventListener('change',()=>{TR=+t.value;try{const st=JSON.parse(localStorage.getItem('roll')||'{}');st.tr=st.tr||{};st.tr[SONG.slug]=TR;localStorage.setItem('roll',JSON.stringify(st));}catch(e){}if(!running){buildEvents();draw();}});})();
function loadSong(k){SONG=SONGS[k]||SONGS[Object.keys(SONGS)[0]];GTR=SONG.gtr||null;CH=SONG.chordNotes||{};CHORDS=SONG.chords||[];
  // подписи тональностей: реальные названия относительно тональности песни (keyRoot = нота, keyMinor)
  [...$('tr').options].forEach(o=>{const i=+o.value;const kn=SONG.keyRoot==null?'':NAMES[((SONG.keyRoot+i)%12+12)%12]+(SONG.keyMinor?'m':'');
    o.textContent=i===0?(kn?kn+' ('+(SONG.keyNote||'оригинальная')+')':'оригинальная'):(kn?kn+' ('+(i>0?'+':'')+i+')':(i>0?'+':'')+i);});
  TR=0;try{const st=JSON.parse(localStorage.getItem('roll')||'{}');TR=+((st.tr||{})[SONG.slug]||0);}catch(e){}$('tr').value=TR;$('tr').disabled=!!GTR&&useGtr();
  document.title='Нотная дорожка — '+SONG.title;
  const sel=$('section');const cur=sel.value;sel.innerHTML='<option value="all">вся песня</option>';
  [...new Set(SONG.items.map(i=>i.sec))].forEach(sc=>{const o=document.createElement('option');o.value=sc;o.textContent=sc;sel.appendChild(o);});
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'all';
  $('tempoSong').value=SONG.bpm;$('tempoSong').textContent=SONG.bpm+' (песня)';if(![...$('tempo').options].some(o=>o.value===$('tempo').value))$('tempo').value=SONG.bpm;
  // минус: «своя гитара» только если у песни есть запись; аккорды — только если есть чарт
  const bk=$('backing');bk.querySelector('[value=guitar]').disabled=!GTR;bk.querySelector('[value=synth]').textContent=CHORDS.length?'аккомпанемент':'только ритм';
  if(bk.value==='guitar'&&!GTR)bk.value=CHORDS.length?'synth':'none';
  $('gtr').src=GTR?GTR.url:'';
  buildEvents();draw();}
$('song').addEventListener('change',()=>{try{const st=JSON.parse(localStorage.getItem('roll')||'{}');st.song=$('song').value;localStorage.setItem('roll',JSON.stringify(st));}catch(e){}if(!running)loadSong($('song').value);});
try{const st=JSON.parse(localStorage.getItem('roll')||'{}');if(st.song&&SONGS[st.song])$('song').value=st.song;}catch(e){}
loadSong($('song').value);
resize();listMics();
</script>
