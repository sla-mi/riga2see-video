<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pitch Track</title>
<style>
:root{--bg:#0f1114;--panel:#1a1d23;--grid:#2a2f38;--grid2:#20242b;--text:#e9e6df;--muted:#8b93a1;--accent:#e9a23b;--accent-soft:rgba(233,162,59,.25);--line:#f4f4f4;--good:#46b36d;--near:#d4c13c;--flat:#5b8def;--sharp:#e5544d;--btn:#e9e6df;--btnfg:#14171c;--chip:#252a33;--rec:#e5544d;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
#songCtl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
#songCtl select{flex:1 1 40%;min-width:120px;max-width:260px}
#settings{display:flex;flex-wrap:wrap;gap:8px 28px;padding:10px 14px;background:var(--panel);border-radius:14px}
#settings[hidden]{display:none}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}.grp b{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
label.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
select,input[type=range]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:5px 8px}
input[type=range]{width:90px;padding:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.ghost{background:var(--chip);color:var(--text)}
button:disabled{opacity:.35;cursor:default}
button.rec{background:var(--rec);color:#fff}
button.round{flex:0 0 auto;width:74px;height:74px;min-height:74px;border-radius:50%;padding:0;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
button.stopb::before{content:"■";margin-right:6px}
button.active{outline:2px solid var(--accent)}
button.tab{padding:11px 20px;font-size:16px}
.grp.pair{flex-wrap:nowrap;gap:8px}
button.big{min-height:46px;font-size:17px;padding:10px 22px}
@media (max-width:820px){
  body{padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
  select,input[type=range]{font-size:16px;padding:8px 10px}
  button{min-height:44px;font-size:16px}
  #dronebar{gap:10px 16px}
  #dronebar .grp{width:100%}
  .grp.pair button.round{flex:0 0 auto}
  #dbig{font-size:38px;top:8px}#dsub{top:58px;font-size:14px}
  header{gap:8px 10px}
}button.tab.on{background:var(--accent);color:#14171c}
#toast{padding:8px 12px;border-radius:10px;background:var(--chip);color:var(--near);font-size:14px}
#toast[hidden]{display:none}
#dronebar{display:flex;flex-wrap:wrap;gap:8px 28px;padding:10px 14px;background:var(--panel);border-radius:14px}
#dronebar[hidden]{display:none}
#dbig{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:44px;font-weight:700}
#dsub{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:15px;color:var(--muted)}
#dstats{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:16px;padding:0 4px}
#dstats b{color:var(--text);font-size:24px}
#dlist{display:flex;flex-direction:column;gap:8px;padding:2px 4px 6px;max-height:34vh;overflow:auto}
#dlist[hidden]{display:none}
.ses{display:flex;flex-direction:column;gap:5px;padding:8px 10px;background:var(--panel);border-radius:12px}
.ses .hd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:13px}
.ses .hd b{color:var(--text);font-size:15px}
.att{display:flex;flex-wrap:wrap;gap:5px}
.att i{font-style:normal;font-size:15px;padding:4px 10px;border-radius:8px;background:var(--chip);white-space:nowrap}
#stage{position:relative;flex:1;min-height:300px;background:var(--panel);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#meter{position:absolute;right:12px;bottom:28px;width:120px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--good)}
#meterLbl{position:absolute;right:12px;bottom:40px;font-size:11px;color:var(--muted);letter-spacing:.06em}
#msg{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:22px;color:var(--muted);pointer-events:none;padding:0 20px}
#modeTag{position:absolute;right:12px;top:10px;font-size:13px;color:var(--muted);padding:4px 10px;border-radius:8px;background:var(--chip)}
#scrubrow{display:flex;align-items:center;gap:8px;position:absolute;left:12px;right:12px;top:8px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
#scrubrow[hidden]{display:none}
#scrubrow input[type=range]{flex:1;width:auto}#scrubrow span{color:var(--muted);font-size:13px;min-width:56px;text-align:right}#scrubrow button{padding:6px 12px}
#result{display:none;flex-direction:column;gap:8px;padding:10px 12px;background:var(--panel);border-radius:14px}
#result.show{display:flex}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:16px}
.stats b{color:var(--text);font-size:24px}.stats em{font-style:normal;color:var(--good);font-size:14px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 7px;border-radius:7px;font-size:13px;line-height:1.15;text-align:center;background:var(--chip);cursor:pointer}
.chip small{display:block;font-size:10px;opacity:.85}.chip.cur{outline:2px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#focus{display:flex;flex-direction:column;gap:6px}
#focus .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:16px}
#focus .row>b{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;min-width:74px}
#focus .tag{padding:4px 10px;border-radius:8px;font-size:15px;background:var(--chip);white-space:nowrap}
#focus .warn{color:var(--near)}

</div>

    <label class="ctl">volume <input id="dVol" type="range" min="0" max="100" value="55"></label>
  </div>
  <div class="grp setSong"><b>Song</b>
    <label class="ctl">backing <select id="backing"><option value="synth" selected>accompaniment</option><option value="guitar">own guitar (recording)</option><option value="none">melody only</option></select></label>
    <label class="ctl">key <select id="tr"></select></label>
    <label class="ctl">voice <select id="oct"><option value="-12">low (−1 oct)</option><option value="0" selected>as written</option><option value="12">high (+1 oct)</option></select></label>
    <label class="ctl">tempo <select id="tempo"><option value="84" id="tempoSong">84 (song)</option><option value="70">70</option><option value="60">60</option><option value="50">50</option></select></label>
  </div>
  <div class="grp setSong"><b>Volume</b>
    <label class="ctl">melody <input id="vol" type="range" min="0" max="100" value="60"></label>
    <label class="ctl">accompaniment <input id="chvol" type="range" min="0" max="100" value="55"></label>
    <label class="ctl">your voice <input id="vcvol" type="range" min="0" max="100" value="90"></label>
  </div>
  <div class="grp setSong"><b>Devices</b>

    <button id="mictest" class="ghost">Mic check</button>
    <button id="sndtest" class="ghost" title="A tone and 2 s of backing, no mic — shows where the sound goes">Sound test</button>
  </div>
</div>
<audio id="gtr" preload="auto"></audio>
<div id="stage"><canvas id="cv"></canvas><div id="modeTag">idle</div><div id="scrubrow" hidden><button id="prev" class="ghost" title="← previous syllable">◀</button><input id="scrub" type="range" min="0" max="1000" value="0"><button id="next" class="ghost" title="→ next syllable">▶</button><span id="scrubT">0.0 s</span></div><div id="dbig" hidden></div><div id="dsub" hidden></div><div id="meter" title="microphone level"><i></i></div><div id="meterLbl">mic</div><div id="msg">tap to start</div></div>

  <div id="focus"></div>
  <div class="chips" id="chips"></div>

</div>
<div id="dstats" hidden></div>
