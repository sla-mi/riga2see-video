<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8">
<title>Pitch Track</title>
<style>
:root{--bg:#0f1114;--panel:#1a1d23;--grid:#2a2f38;--grid2:#20242b;--text:#e9e6df;--muted:#8b93a1;--accent:#e9a23b;--accent-soft:rgba(233,162,59,.25);--line:#f4f4f4;--good:#46b36d;--near:#d4c13c;--flat:#5b8def;--sharp:#e5544d;--btn:#e9e6df;--btnfg:#14171c;--chip:#252a33;--rec:#e5544d;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;padding:10px 16px;display:flex;flex-direction:column;gap:10px;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-size:17px;margin:0;font-weight:600}
label.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
select,input[type=range]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:5px 8px}
input[type=range]{width:90px;padding:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.ghost{background:var(--chip);color:var(--text)}
button:disabled{opacity:.35;cursor:default}
button.rec{background:var(--rec);color:#fff}button.rec::before{content:"●";margin-right:6px}
button.play::before{content:"▶";margin-right:6px}button.stopb::before{content:"■";margin-right:6px}
button.active{outline:2px solid var(--accent)}
#stage{position:relative;flex:1;min-height:300px;background:var(--panel);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#meter{position:absolute;left:12px;bottom:10px;width:120px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--good)}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:20px;color:var(--muted);pointer-events:none;padding:0 20px}
#modeTag{position:absolute;right:12px;top:10px;font-size:13px;color:var(--muted);padding:4px 10px;border-radius:8px;background:var(--chip)}
#scrubrow{display:flex;align-items:center;gap:8px;position:absolute;left:12px;right:12px;top:8px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
#scrubrow[hidden]{display:none}
#scrubrow input[type=range]{flex:1;width:auto}#scrubrow span{color:var(--muted);font-size:13px;min-width:56px;text-align:right}#scrubrow button{padding:6px 12px}
#result{display:none;flex-direction:column;gap:8px;padding:10px 12px;background:var(--panel);border-radius:14px}
#result.show{display:flex}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.stats b{color:var(--text);font-size:18px}.stats em{font-style:normal;color:var(--good);font-size:14px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 7px;border-radius:7px;font-size:13px;line-height:1.15;text-align:center;background:var(--chip);cursor:pointer}
.chip small{display:block;font-size:10px;opacity:.85}.chip.cur{outline:2px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style></head><body>
<header>
  <h1>Pitch Track</h1>
  <label class="ctl">song <select id="song"></select></label>
  <label class="ctl">backing <select id="backing"><option value="synth" selected>accompaniment</option><option value="guitar">own guitar (recording)</option><option value="none">melody only</option></select></label>
  <label class="ctl">key <select id="tr"></select></label>
  <label class="ctl">voice <select id="oct"><option value="-12">low (−1 oct)</option><option value="0" selected>as written</option><option value="12">high (+1 oct)</option></select></label>
  <label class="ctl">tempo <select id="tempo"><option value="84" id="tempoSong">84 (song)</option><option value="70">70</option><option value="60">60</option><option value="50">50</option></select></label>
  <span class="ctl">volume:</span>
  <label class="ctl">melody <input id="vol" type="range" min="0" max="100" value="60"></label>
  <label class="ctl">accompaniment <input id="chvol" type="range" min="0" max="100" value="55"></label>
  <label class="ctl">voice <input id="vcvol" type="range" min="0" max="100" value="90"></label>
  <label class="ctl">mic <select id="mic"><option value="">default</option></select></label>
  <label class="ctl">headphones <select id="spk"><option value="">default</option></select></label>
  <label class="ctl">takes <select id="takes"><option value="">— new —</option></select></label>
  <button id="rec" class="rec">Rec</button>
  <button id="play" class="play ghost" disabled>Play</button>
  <button id="stop" class="stopb ghost" disabled>Stop</button>
  <button id="mictest" class="ghost">Mic check</button>
  <button id="sndtest" class="ghost" title="A tone and 2 s of backing, no mic — shows where the sound goes">Sound test</button>
</header>
<audio id="gtr" preload="auto"></audio>
<div id="stage"><canvas id="cv"></canvas><div id="modeTag">idle</div><div id="scrubrow" hidden><button id="prev" class="ghost" title="← previous syllable">◀</button><input id="scrub" type="range" min="0" max="1000" value="0"><button id="next" class="ghost" title="→ next syllable">▶</button><span id="scrubT">0.0 s</span></div><div id="meter"><i></i></div><div id="msg">Rec or Space — allow the mic. 4 clicks, then sing. Space pauses; Space again continues. Stop or the end of the song → scrub and Play to listen back.</div></div>
<div id="result">
  <div class="stats"><span>hit <b id="rIn">—</b> <em id="rLvl"></em></span><span>near <b id="rNear">—</b></span><span>off <b id="rMiss">—</b></span><span>flat <b id="rLow">—</b></span><span>sharp <b id="rHigh">—</b></span><span>syllables <b id="rN">0</b></span><span>recorded <b id="rCov">—</b></span></div>
  <div class="legend"><span><i style="background:var(--good)"></i>hit (±25, long notes ±15)</span><span><i style="background:var(--near)"></i>near</span><span><i style="background:var(--flat)"></i>flat</span><span><i style="background:var(--sharp)"></i>sharp</span><span><i style="background:var(--chip);border:1px solid var(--grid)"></i>no voice</span></div>
  <div class="chips" id="chips"></div>
  <div id="hist" class="stats"></div>
</div>

Object.keys(SONGS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=SONGS[k].title+' · '+SONGS[k].artist;$('song').appendChild(o);});
(function(){const t=$('tr');for(let i=-6;i<=6;i++){const o=document.createElement('option');o.value=i;t.appendChild(o);}
  t.addEventListener('change',()=>{TR=+t.value;ST.tr=ST.tr||{};ST.tr[SONG.slug]=TR;saveST();if(mode==='idle'){buildEvents();draw();}});})();
function loadSong(k){SONG=SONGS[k]||SONGS[Object.keys(SONGS)[0]];GTR=SONG.gtr||null;CH=SONG.chordNotes||{};CHORDS=SONG.chords||[];document.title='Pitch Track — '+SONG.title;
  [...$('tr').options].forEach(o=>{const i=+o.value;const kn=SONG.keyRoot==null?'':NAMES[((SONG.keyRoot+i)%12+12)%12]+(SONG.keyMinor?'m':'');o.textContent=i===0?(kn?kn+' ('+(SONG.keyNote||'original')+')':'original'):(kn?kn+' ('+(i>0?'+':'')+i+')':(i>0?'+':'')+i);});
  TR=+((ST.tr||{})[SONG.slug]||0);$('tr').value=TR;$('tr').disabled=useGtr();OCT=+((ST.oct||{})[SONG.slug]||0);$('oct').value=OCT;
  $('tempoSong').value=SONG.bpm;$('tempoSong').textContent=SONG.bpm+' (song)';if(![...$('tempo').options].some(o=>o.value===$('tempo').value))$('tempo').value=SONG.bpm;
  const bk=$('backing');bk.querySelector('[value=guitar]').disabled=!GTR;bk.querySelector('[value=synth]').textContent=CHORDS.length?'accompaniment':'beat only';if(bk.value==='guitar'&&!GTR)bk.value=CHORDS.length?'synth':'none';
  $('gtr').src=GTR?GTR.url:'';clearTake();review=false;$('scrubrow').hidden=true;$('result').classList.remove('show');buildEvents();setMode('idle');draw();loadTakes();}
$('oct').addEventListener('change',()=>{OCT=+$('oct').value;ST.oct=ST.oct||{};ST.oct[SONG.slug]=OCT;saveST();if(mode==='idle'){buildEvents();draw();}});
$('song').addEventListener('change',()=>{ST.song=$('song').value;saveST();if(mode==='idle')loadSong($('song').value);});
if(ST.song&&SONGS[ST.song])$('song').value=ST.song;
loadSong($('song').value);resize();listMics();
</script>
