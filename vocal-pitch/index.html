<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">

<title>Pitch Track</title>
<style>
:root{
 --bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--chip:#2c2c2e;--sep:rgba(255,255,255,.08);
 --grid:rgba(255,255,255,.13);--grid2:rgba(255,255,255,.085);
 --text:#ffffff;--muted:#98989f;--line:#f5f5f7;--tint:#0a84ff;--accent:#ff9f0a;
 --good:#30d158;--near:#ffd60a;--flat:#64d2ff;--sharp:#ff453a;--rec:#ff3b30;
 --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.1);--hair:rgba(255,255,255,.1);
 --r:20px;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font:15px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
 -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
 padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
 display:flex;flex-direction:column;gap:12px;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
 -webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--panel2);border-radius:11px;padding:2px;gap:2px}
.seg button{background:transparent;border-radius:9px;padding:9px 22px;font-size:15px;font-weight:600;color:var(--text);transition:background .18s}
.seg button.on{background:#5a5a5f;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.icon{width:42px;height:42px;border-radius:50%;padding:0;font-size:18px;background:var(--panel2);margin-left:auto;display:flex;align-items:center;justify-content:center}
.icon.active{background:var(--tint)}
button{font:inherit;font-weight:590;border:0;border-radius:12px;padding:11px 16px;background:var(--panel2);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
button.ghost{background:var(--panel2);color:var(--text)}
button:active{opacity:.65}
button:disabled{opacity:.3;cursor:default}
select{appearance:none;-webkit-appearance:none;font:inherit;font-weight:500;color:var(--text);
 background:var(--panel2) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%2398989f' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M1.5 2 6 6.2 10.5 2'/%3E%3C/svg%3E") no-repeat right 11px center;
 background-size:11px;border:0;border-radius:11px;padding:10px 32px 10px 12px;max-width:100%;text-overflow:ellipsis}
select:disabled{opacity:.4}
input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 auto;order:2;margin:0;width:46px;height:28px;border-radius:15px;background:#39393d;transition:background .2s}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .2s}
input[type=checkbox]:checked{background:var(--good)}
input[type=checkbox]:checked::after{transform:translateX(18px)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:130px;padding:0;border:0;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#48484a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
/* ---- song row ---- */
#songCtl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#songCtl select{flex:1 1 40%;min-width:0}
#songCtl .btns{display:flex;align-items:flex-start;justify-content:center;gap:34px;margin:0 auto}
.bw{display:flex;flex-direction:column;align-items:center;gap:6px}
.bw span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
#rec,#dStart{width:74px;height:74px;min-height:74px;border-radius:50%;background:transparent;padding:0;font-size:0;flex:0 0 auto;
 border:3px solid rgba(235,235,245,.5);display:flex;align-items:center;justify-content:center}
#rec::after,#dStart::after{content:"";width:58px;height:58px;border-radius:50%;background:var(--rec);transition:width .22s,height .22s,border-radius .22s}
#rec.active::after,#dStart.active::after{width:28px;height:28px;border-radius:8px}
#play{width:74px;height:74px;min-height:74px;border-radius:50%;padding:0;font-size:26px;flex:0 0 auto;background:var(--panel2);display:flex;align-items:center;justify-content:center}
#play.active{background:var(--tint)}
@media (max-width:560px){
 #songCtl select{flex:1 1 45%}
 #songCtl .btns{width:100%;margin-top:2px}
}
/* ---- grouped lists (settings, drone bar) ---- */
#setback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;opacity:0;pointer-events:none;transition:opacity .25s}
#setback.open{opacity:1;pointer-events:auto}
#settings{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:84vh;overflow:auto;-webkit-overflow-scrolling:touch;
 display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px;
 padding:0 18px calc(24px + env(safe-area-inset-bottom));background:rgba(28,28,30,.97);
 -webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);
 border-radius:26px 26px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.55);
 transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
#settings.open{transform:translateY(0)}
.sheetHd{grid-column:1/-1;position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 0 12px;
 background:linear-gradient(rgba(28,28,30,.98) 70%,rgba(28,28,30,0));z-index:2}
.sheetHd .grab{position:absolute;left:50%;top:6px;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);transform:translateX(-50%)}
.sheetHd span{font-size:17px;font-weight:700;margin-top:8px}
.sheetHd button{margin-left:auto;margin-top:8px;padding:8px 16px;border-radius:11px;background:var(--tint);color:#fff;font-weight:600;min-height:0}
#dronebar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 26px;padding:4px 16px 12px;background:rgba(28,28,30,.72);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:inset 0 0 0 1px var(--hair);border-radius:var(--r)}
#dronebar{flex-direction:column;align-items:center;gap:14px;padding:14px 16px 12px!important}
.drow{display:flex;gap:10px;width:100%}
.dsel{flex:1;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.dsel select{flex:1;min-width:0}
#dronebar .grp{flex:1 1 250px}
.grp{display:flex;flex-direction:column;min-width:0}
.grp b{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:14px 0 4px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;color:var(--text);font-size:15px;border-bottom:1px solid var(--sep)}
.grp .ctl:last-of-type{border-bottom:0}
.ctl select{max-width:62%}
.ctlv{display:flex;align-items:center;gap:10px}
.ctlv b{min-width:58px;text-align:right;font-weight:600}
.ctl b{padding:0;font-size:14px;color:var(--text);text-transform:none;letter-spacing:0;font-weight:600}
.grp>button{margin:12px 0 2px;align-self:flex-start}
.micRow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
#micLive{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
#micLive .lvl{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#micLive .lvl i{display:block;height:100%;width:0;background:var(--good);border-radius:4px;transition:width .06s}
#micNote{min-width:92px;text-align:right;font-weight:700;font-size:17px}
#dronebar .grp.pair{flex:0 0 auto;flex-direction:row;align-items:center;gap:14px;padding:10px 0}
#dHint{border:0;color:var(--muted);font-size:14px;min-height:0}
#mictest.active{background:var(--tint)}
#toast{position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:40;padding:12px 15px;border-radius:16px;background:rgba(44,44,46,.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--near);font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
/* ---- stage ---- */
#stage{position:relative;flex:1;min-height:max(320px,64vh);background:rgba(28,28,30,.72);box-shadow:inset 0 0 0 1px var(--hair);border-radius:24px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#meter,#meterLbl{display:none!important}
#meter{position:absolute;right:14px;bottom:26px;width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--good);border-radius:3px}
#meterLbl{position:absolute;right:14px;bottom:36px;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#msg{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:19px;color:var(--muted);pointer-events:none;padding:0 24px}
#modeTag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 11px;border-radius:9px;background:rgba(44,44,46,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#dbig{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:46px;font-weight:700;letter-spacing:-.02em}
#dsub{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:15px;color:var(--muted)}
#scrubrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:rgba(28,28,30,.72);box-shadow:inset 0 0 0 1px var(--hair)}
#scrubrow input[type=range]{flex:1;width:auto}
#scrubrow span{color:var(--muted);font-size:13px;min-width:56px;text-align:right}
#scrubrow button{padding:7px 13px;border-radius:10px;background:rgba(255,255,255,.1)}
/* ---- results ---- */
#result{display:none;flex-direction:column;gap:14px;padding:16px;background:rgba(28,28,30,.72);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:inset 0 0 0 1px var(--hair);border-radius:var(--r)}
#result.show{display:flex}
.hero{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 12px}
.hero b{font-size:54px;font-weight:700;letter-spacing:-.025em;line-height:.95}
.hero .unit{color:var(--muted);font-size:15px}
.hero em{font-style:normal;color:var(--muted);font-size:15px}
.hero .delta{flex-basis:100%;max-width:max-content;margin-top:2px}
.delta{font-size:15px;font-weight:600;padding:5px 11px;border-radius:10px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.delta.up{color:var(--good);background:rgba(48,209,88,.16)}
.delta.dn{color:var(--sharp);background:rgba(255,69,58,.16)}
.rank{background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);border-radius:18px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.rank .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rank .hd b{font-size:30px;font-weight:700;letter-spacing:-.01em}
.rank .hd span{color:var(--muted);font-size:15px}
.rank .track{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.1);margin:6px 10px 0}
.rank .track i{position:absolute;top:2px;width:4px;height:6px;border-radius:2px;background:rgba(255,255,255,.4);transform:translateX(-2px)}
.rank .track em{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--panel2);transform:translateX(-10px)}
.rank .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.tile{background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;gap:1px}
.tile u{text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile b{font-size:23px;font-weight:700;letter-spacing:-.01em}
.tile s{text-decoration:none;font-size:13px;font-weight:600;color:var(--muted)}
.tile s.up{color:var(--good)}.tile s.dn{color:var(--sharp)}
.sect{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:2px 0 -6px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.fc{background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);border-radius:16px;padding:11px 12px 11px 15px;position:relative;overflow:hidden}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted)}
.fc.bad::before{background:var(--sharp)}
.fc.ok::before{background:var(--good)}
.fc u{text-decoration:none;display:block;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}
.fc .v{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.fc .v b{font-size:26px;font-weight:700;letter-spacing:-.01em}
.fc .v s{text-decoration:none;font-size:14px;font-weight:600;color:var(--muted)}
.fc .v s.up{color:var(--good)}.fc .v s.dn{color:var(--sharp)}
.fc small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
#focus{display:flex;flex-direction:column;gap:10px}
#focus .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px}
#focus .tag{padding:8px 13px;border-radius:12px;font-size:16px;font-weight:500;background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
#focus .warn{color:var(--near)}
.deep,#deep{background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);border-radius:16px;padding:10px 14px}
#deep summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;align-items:center;gap:8px}
#deep summary::before{content:'›';display:inline-block;transition:transform .2s;color:var(--muted);font-size:20px}
#deep[open] summary::before{transform:rotate(90deg)}
#deepBody{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.dsec b{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.drow2{display:grid;grid-template-columns:minmax(92px,1.2fr) 3fr 44px 30px;align-items:center;gap:8px;padding:4px 6px;border-radius:9px;font-size:15px}
.drow2 .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.drow2 .bar i{display:block;height:100%;border-radius:4px}
.drow2 em{font-style:normal;font-weight:700;text-align:right}.drow2 small{color:var(--muted);font-size:12px;text-align:right}
.drow2.bad{background:rgba(255,69,58,.14)}.drow2.good{background:rgba(48,209,88,.12)}
.keyf{display:flex;flex-wrap:wrap;gap:6px}.keyf span{padding:6px 11px;border-radius:10px;font-size:14px;font-weight:600;background:rgba(255,69,58,.16);color:#ff8a80}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-height:32vh;overflow:auto;-webkit-overflow-scrolling:touch}
.chip{padding:5px 9px;border-radius:10px;font-size:15px;line-height:1.15;text-align:center;background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);color:var(--muted);cursor:pointer}
.chip small{display:block;font-size:10px;opacity:.85}
.chip.cur{outline:2px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;color:var(--muted);font-size:14px}
.stats b{color:var(--text);font-size:17px;font-weight:700}
/* ---- drone lists ---- */
#dstats{padding:0}
#dlist{display:flex;flex-direction:column;gap:8px;padding:2px 0 6px;max-height:34vh;overflow:auto}
.ses{display:flex;flex-direction:column;gap:6px;padding:11px 14px;background:rgba(28,28,30,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px var(--hair);border-radius:18px}
.ses .hd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:13px}
.ses .hd b{color:var(--text);font-size:15px}
.att{display:flex;flex-wrap:wrap;gap:5px}
.att i{font-style:normal;font-size:15px;padding:6px 11px;border-radius:11px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
@media (max-width:820px){
 select{font-size:16px}
 button{min-height:44px;font-size:16px}
 #dbig{font-size:40px;top:10px}#dsub{top:62px;font-size:14px}
}
</style></head><body>
<header>
  <div class="seg"><button id="tabSong" class="on">Songs</button><button id="tabDrone">Drone</button></div>
  <button id="gear" class="icon" title="Settings">⚙</button>
</header>
<div id="songCtl">
  <select id="song"></select>
  <select id="takes" title="earlier takes"><option value="">— new —</option></select>
  <div class="btns"><div class="bw"><button id="rec" class="rec" title="Record / Stop">●</button><span id="recCap">Record</span></div>
  <div class="bw"><button id="play" class="ghost" title="Listen">▶</button><span id="playCap">Listen</span></div></div>
</div>
<div id="toast" hidden></div>
<div id="dronebar" hidden>
  <div class="drow">
    <label class="dsel">tonic <select id="dTonic"></select></label>
    <label class="dsel">sing <select id="dEx"><option value="0" selected>unison</option><option value="3">minor third</option><option value="4">third</option><option value="5">fourth</option><option value="7">fifth</option><option value="9">sixth</option><option value="12">octave</option></select></label>
  </div>
  <div class="bw"><button id="dStart" class="rec" title="Start / Stop">●</button><span id="dHint">Start</span></div>
</div>
</div>
<div id="setback"></div>
<div id="settings">
  <div class="sheetHd"><i class="grab"></i><span>Settings</span><button id="setDone">Done</button></div>
  <div class="grp" id="setDrone" hidden><b>Drone</b>
    <label class="ctl">hold <select id="dHold"><option value="3">3 s</option><option value="5" selected>5 s</option><option value="8">8 s</option><option value="12">12 s</option></select></label>
    <label class="ctl">timbre <select id="dTimbre"><option value="triangle" selected>triangle</option><option value="sine">sine</option><option value="square">square</option><option value="saw">saw</option></select></label>
    <label class="ctl"><input type="checkbox" id="dFifth"> +5th</label>
    <label class="ctl"><input type="checkbox" id="dOctL"> +8ve</label>
    <label class="ctl">timer <select id="dTimer"><option value="0" selected>off</option><option value="3">3 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="20">20 min</option><option value="30">30 min</option></select></label>
    <label class="ctl">volume <input id="dVol" type="range" min="0" max="100" value="55"></label>
  </div>
  <div class="grp setSong"><b>Song</b>
    <label class="ctl">backing <select id="backing"><option value="synth" selected>accompaniment</option><option value="guitar">own guitar (recording)</option><option value="none">melody only</option></select></label>
    <label class="ctl">key <select id="tr"></select></label>
    <label class="ctl">voice <select id="oct"><option value="-12">low (−1 oct)</option><option value="0" selected>original</option><option value="12">high (+1 oct)</option></select></label>
    <label class="ctl">words <select id="lyr"><option value="notes" selected>on the notes</option><option value="line">line under the phrase</option></select></label>
    <label class="ctl">sound delay <span class="ctlv"><input id="sync" type="range" min="0" max="320" step="10" value="0"><b id="syncV">0 ms</b></span></label>
    <label class="ctl" title="Only for listening: EQ, compression and reverb on your voice. Does not touch the recording or the score">voice sound <select id="fx"><option value="off">dry</option><option value="soft" selected>soft</option><option value="studio">studio</option><option value="hall">hall</option></select></label>
    <label class="ctl" title="Shifts your recorded voice against the accompaniment when you press Play">voice in playback <span class="ctlv"><input id="voff" type="range" min="-400" max="200" step="10" value="0"><b id="voffV">0 ms</b></span></label>
    <label class="ctl">tempo <select id="tempo"><option value="84" id="tempoSong">84 (song)</option><option value="70">70</option><option value="60">60</option><option value="50">50</option></select></label>
  </div>
  <div class="grp setSong"><b>Volume</b>

  const now=Date.now()/1000,PPS2=Math.max(40,W/8);let cur=null;
  for(const s of DR.samples){const x=W-(now-s.t)*PPS2;if(x<0)continue;const mf=fold(s.m,tg),c=(mf-tg)*100;
    ctx.fillStyle=colorFor(c,1);ctx.fillRect(x-1.5,y(mf)-2,3,4);if(now-s.t<0.2)cur=c;}
  const big=$('dbig'),sub=$('dsub');
  if(cur==null){big.textContent='—';big.style.color=getVar('--muted');sub.textContent=DR.on?nm(tg)+' · hold '+holdSec()+' s':'tap to start';}
  else{const beats=Math.abs(freqOf(tg)*(Math.pow(2,cur/1200)-1));
    big.textContent=(cur>0?'+':'')+Math.round(cur)+' ¢';big.style.color=colorFor(cur,1);
    sub.textContent=beats.toFixed(1)+' Hz';}
  {const v=lastReso,x=W-26,h=H*0.38,y0=H*0.30;
    ctx.fillStyle=getVar('--chip');ctx.fillRect(x,y0,10,h);
    if(v!=null){const p=Math.max(0,Math.min(1,(v+14)/14));ctx.fillStyle=resoCol(v);ctx.fillRect(x,y0+h*(1-p),10,h*p);}
    ctx.fillStyle=getVar('--muted');ctx.font='11px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('ring',x+5,y0-8);ctx.textAlign='left';}
  keyboard(lo2,hi2,y,rh,tg);
  attDraw(now,tg);
  const mt=$('meter').firstElementChild,db=20*Math.log10(lastRms+1e-6);
  mt.style.width=Math.max(0,Math.min(100,(db+60)/60*100))+'%';mt.style.background=lastRms<0.003?getVar('--muted'):getVar('--good');}
// ---- попытка: одна выдержанная нота. Вход (подъезд к ноте) НЕ считается — он меряется отдельно как "entry".
const ATT={on:false,t0:0,last:0,lock:null,pts:[],list:[],show:0,best:0};
const holdSec=()=>+$('dHold').value;
function chime(kind){
  ensureAudio();const n=ac.currentTime+0.02;
  const seq={great:[[72,0],[76,.13],[79,.26],[84,.39]],good:[[72,0],[79,.14]],ok:[[69,0]],weak:[[57,0]],best:[[76,0],[81,.12],[88,.24]]}[kind]||[[69,0]];
  for(const [m,dt] of seq)tone(m,n+dt,kind==='weak'?0.28:0.2);}
function attGrade(p){return p>=90?'great':p>=70?'good':p>=40?'ok':'weak';}
function attFinish(now){
  const a=ATT;a.on=false;
  const dur=a.last-a.t0;
  if(dur<1||a.pts.length<8){ATT.pts=[];return;}                 // короткий звук — не попытка
  const from=a.t0+Math.max(0.3,a.lock==null?0.3:a.lock);         // считаем с момента, когда нота взята
  const u=a.pts.filter(x=>x.t>=from);if(u.length<5){ATT.pts=[];return;}
  const cs=u.map(x=>x.c).sort((x,y)=>x-y),med=Math.round(cs[Math.floor(cs.length/2)]);
  const inT=Math.round(100*u.filter(x=>Math.abs(x.c)<=HIT).length/u.length);
  const first=u.filter(x=>x.t<from+1),last=u.filter(x=>x.t>a.last-1);
  const mm=arr=>{const b=arr.map(x=>x.c).sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:0;};
  const drift=Math.round(mm(last)-mm(first));
  const rs=u.map(x=>x.r).filter(v=>v!=null);
  const ring=rs.length?Math.round(100*rs.filter(v=>v>=-3).length/rs.length):null;
  const rec={inT,med,drift,ring,entry:a.lock==null?null:+a.lock.toFixed(1),held:+dur.toFixed(1),grade:attGrade(inT),t:Date.now(),
    ex:$('dEx').selectedOptions[0].textContent,tonic:nm(dMidi())};
  {const ex=rec.ex;
   const peers=attPeers(ex,a.list);
   if(peers.length>=2){rec.place=1+peers.filter(v=>v>inT).length;rec.tot=peers.length+1;}}
  a.list.push(rec);while(a.list.length>40)a.list.shift();a.show=now+3;a.pts=[];
  const isBest=inT>a.best&&a.list.length>1;a.best=Math.max(a.best,inT);
  chime(isBest?'best':rec.grade);
  DR.stat.att=(DR.stat.att||0)+1;DR.stat.attSum=(DR.stat.attSum||0)+inT;
  droneStats();droneList();droneRank();}
function attTick(now,c){
  const a=ATT;
  if(c!=null){
    if(!a.on){a.on=true;a.t0=now;a.lock=null;a.pts=[];}
    a.last=now;a.pts.push({t:now,c,r:lastReso});
    if(a.lock==null&&Math.abs(c)<=NEAR)a.lock=now-a.t0;
    if(now-a.t0>=holdSec()+(a.lock||0))attFinish(now);
  } else if(a.on&&now-a.last>0.4)attFinish(now);}
function attDraw(now,tg){
  const a=ATT;
  // полоса прогресса выдержки
  if(a.on){const need=holdSec()+(a.lock||0),p=Math.min(1,(now-a.t0)/need);
    ctx.fillStyle=getVar('--chip');ctx.fillRect(0,H-6,W,6);ctx.fillStyle=getVar('--accent');ctx.fillRect(0,H-6,W*p,6);
    ctx.fillStyle=getVar('--muted');ctx.font='12px -apple-system,sans-serif';ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillText('hold '+(now-a.t0).toFixed(1)+' / '+need.toFixed(1)+' s',W-10,H-10);ctx.textAlign='left';}
  // результат последней попытки
  const r=a.list[a.list.length-1];
  if(r&&now<a.show){const col={great:getVar('--good'),good:getVar('--good'),ok:getVar('--near'),weak:getVar('--sharp')}[r.grade];
    const bw=Math.min(W-36,360),bh=r.place?116:96,bx=(W-bw)/2,by=H*0.40,rr=22;
    ctx.save();ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(bx,by,bw,bh,rr);else ctx.rect(bx,by,bw,bh);
    ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=24;ctx.shadowOffsetY=8;
    ctx.fillStyle='rgba(30,30,34,.82)';ctx.fill();ctx.shadowColor='transparent';
    ctx.clip();
    const gg=ctx.createLinearGradient(0,by,0,by+bh);
    gg.addColorStop(0,col+'33');gg.addColorStop(1,col+'12');ctx.fillStyle=gg;ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(bx,by,bw,1.2);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=col;ctx.font='700 34px -apple-system,sans-serif';
    ctx.fillText(r.inT+'% in tune',W*0.5,by+34);
    ctx.fillStyle=getVar('--muted');ctx.font='15px -apple-system,sans-serif';
    ctx.fillText((r.med>0?'+':'')+r.med+' \u00a2 \u00b7 in '+(r.entry==null?'\u2014':r.entry+'s')+(r.ring!=null?' \u00b7 ring '+r.ring+'%':''),W*0.5,by+66);
    if(r.place){ctx.fillStyle=getVar('--text');ctx.font='600 17px -apple-system,sans-serif';
      ctx.fillText(ordJS(r.place)+' of '+r.tot+' attempts',W*0.5,by+94);}
    ctx.restore();ctx.textAlign='left';}
  // история попыток — точки внизу
  const n=a.list.length;
  for(let i=0;i<n;i++){const x=W-14-(n-1-i)*16,y2=H-18,g=a.list[i].grade;
    ctx.fillStyle={great:getVar('--good'),good:getVar('--good'),ok:getVar('--near'),weak:getVar('--sharp')}[g];
    ctx.globalAlpha=g==='great'?1:.75;ctx.beginPath();ctx.arc(x,y2,g==='great'?6:5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}}
function attPeers(ex,cur){   // попытки ТОГО ЖЕ упражнения: из истории (у старых записей упражнение хранилось на сессию) и из текущей
  const h=droneHist().reduce((a,r)=>a.concat((r.attempts||[]).filter(x=>(x.ex||r.ex)===ex).map(x=>x.inT)),[]);
  return h.concat((cur||[]).filter(x=>(x.ex||ex)===ex).map(x=>x.inT)).filter(v=>v!=null);}
function droneRank(){   // место последней попытки среди всех своих попыток этого упражнения
  const box=$('drank');box.innerHTML='';const last=ATT.list[ATT.list.length-1];if(!last)return;
  const ex=last.ex||$('dEx').selectedOptions[0].textContent;
  const peers=attPeers(ex,ATT.list.slice(0,-1)).slice(-80);
  box.innerHTML=scaleHTML(last.inT,peers,'attempts \u00b7 '+ex,peers.length?'2nd attempt \u2014 scale from the third':'first attempt \u2014 scale appears later');}
function droneHist(){try{return JSON.parse(localStorage.getItem('drone')||'[]');}catch(e){return [];}}
function droneSave(secs){
  const h=droneHist(),d=new Date(),rec={day:d.toISOString().slice(0,10),ts:d.toISOString(),tonic:nm(dMidi()),
    ex:$('dEx').selectedOptions[0].textContent,secs:Math.round(secs),n:DR.stat.n,good:DR.stat.good,near:DR.stat.near,
    att:ATT.list.length,attAvg:DR.stat.att?Math.round(DR.stat.attSum/DR.stat.att):null,best:ATT.best,attempts:ATT.list.slice(-30)};
  h.push(rec);while(h.length>500)h.shift();try{localStorage.setItem('drone',JSON.stringify(h));}catch(e){}
  fetch('/vocal-api/drone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}).catch(()=>{});}
const attCol=g=>({great:'--good',good:'--good',ok:'--near',weak:'--sharp'})[g]||'--muted';
function attChip(a){const c=getVar(attCol(a.grade));
  return '<i style="background:'+c+'22;color:'+c+'">'+a.inT+'% \u00b7 '+(a.med>0?'+':'')+a.med+' \u00a2'+(a.entry!=null?' \u00b7 in '+a.entry+'s':'')+(a.ring!=null?' \u00b7 ring '+a.ring+'%':'')+'</i>';}
function droneList(){   // сегодняшние сессии и каждая попытка внутри них
  const today=new Date().toISOString().slice(0,10),h=droneHist().filter(r=>r.day===today),blocks=[];
  if(DR.on||ATT.list.length){const l=ATT.list,avg=l.length?Math.round(l.reduce((x,a)=>x+a.inT,0)/l.length):0;
    blocks.push('<div class="ses"><div class="hd"><b>now</b><span>'+nm(dMidi())+' \u00b7 '+$('dEx').selectedOptions[0].textContent+'</span>'+
      '<span>attempts <b>'+l.length+'</b></span>'+(l.length?'<span>avg <b>'+avg+'%</b></span><span>best <b>'+ATT.best+'%</b></span>':'')+
      '</div><div class="att">'+l.slice().reverse().map(attChip).join('')+'</div></div>');}
  for(const r of h.slice().reverse()){const tm=new Date(r.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    blocks.push('<div class="ses"><div class="hd"><b>'+tm+'</b><span>'+r.tonic+' \u00b7 '+r.ex+'</span><span>'+Math.max(1,Math.round(r.secs/60))+' min</span>'+
      (r.att?'<span>attempts <b>'+r.att+'</b></span><span>avg <b>'+(r.attAvg!=null?r.attAvg+'%':'\u2014')+'</b></span>':'')+
      '</div>'+(r.attempts&&r.attempts.length?'<div class="att">'+r.attempts.slice().reverse().map(attChip).join('')+'</div>':'')+'</div>');}
  $('dlist').innerHTML=blocks.join('')||'<div class="ses"><div class="hd">no attempts yet today \u2014 press Start and hold a note</div></div>';}
function droneStats(){   // те же плитки, что и в результатах песни — режимы должны выглядеть одинаково
  const h=droneHist(),today=new Date().toISOString().slice(0,10),mins=a=>Math.round(a.reduce((x,r)=>x+r.secs,0)/60);
  const days=new Set(h.map(r=>r.day));let streak=0;const d0=new Date();
  for(;;){const k=d0.toISOString().slice(0,10);if(days.has(k)){streak++;d0.setDate(d0.getDate()-1);}else break;}
  const meas=h.filter(r=>r.n>20),tot=meas.reduce((x,r)=>x+r.n,0);
  const hit=tot?Math.round(100*meas.reduce((x,r)=>x+r.good,0)/tot):null;
  const rings=ATT.list.map(a=>a.ring).filter(v=>v!=null);
  const T=[],add=(n,v,sub)=>T.push('<div class="tile"><u>'+n+'</u><b>'+v+'</b><s>'+(sub||'&nbsp;')+'</s></div>');
  add('today',mins(h.filter(r=>r.day===today)),'min');
  add('streak',streak,streak===1?'day':'days');
  add('total',mins(h),'min');
  if(hit!=null)add('in \u00b125 \u00a2',hit+'%','all time');
  if(DR.stat.att){add('attempts',DR.stat.att,'now');
    add('avg',Math.round(DR.stat.attSum/DR.stat.att)+'%','now');
    add('best',ATT.best+'%','now');}
  if(rings.length)add('ring',Math.round(rings.reduce((a,b)=>a+b,0)/rings.length)+'%','now');
  $('dstats').innerHTML='<div class="tiles">'+T.join('')+'</div>';}
function setView(v){
  view=v;const song=v==='song';
  $('tabSong').classList.toggle('on',song);$('tabDrone').classList.toggle('on',!song);
  $('songCtl').style.display=song?'flex':'none';$('dronebar').hidden=song;$('dstats').hidden=song;$('dlist').hidden=song;$('drank').hidden=song;
  $('setDrone').hidden=song;document.querySelectorAll('.setSong').forEach(e=>{const keep=!!e.querySelector('#mic');e.hidden=!song&&!keep;});   // в дроне из песенных настроек оставляем только устройства
  $('result').style.display=song?'':'none';$('dbig').hidden=song;$('dsub').hidden=song;
  if(song){droneStop();$('msg').textContent='';draw();}
  else{if(mode!=='idle')finish(false);if(testing)stopTest();$('scrubrow').hidden=true;$('msg').textContent='';droneStats();droneList();droneRank();droneDraw();}
  ST.view=v;saveST();}
$('tabSong').onclick=()=>setView('song');$('tabDrone').onclick=()=>setView('drone');
$('dStart').onclick=()=>DR.on?droneStop():droneStart();
function dBtn(){const b=$('dStart');b.textContent=DR.on?'■':'●';b.classList.toggle('active',DR.on);b.classList.toggle('rec',!DR.on);b.classList.toggle('ghost',DR.on);$('dHint').textContent=DR.on?'Stop':'Start';}
(function(){const t=$('dTonic');for(let m=24;m<=71;m++){const o=document.createElement('option');o.value=m;o.textContent=nm(m);t.appendChild(o);}t.value=45;})();
['dTonic','dTimbre','dEx','dVol','dTimer','dHold'].forEach(id=>{if(ST['d_'+id]!=null)$(id).value=ST['d_'+id];});
['dFifth','dOctL'].forEach(id=>{if(ST['d_'+id]!=null)$(id).checked=!!ST['d_'+id];});
['dTonic','dTimbre','dFifth','dOctL','dEx'].forEach(id=>$(id).addEventListener('change',()=>{
  const el=$(id);ST['d_'+id]=el.type==='checkbox'?el.checked:el.value;saveST();
  if(DR.on&&id!=='dEx'){droneBuild();for(const a of DR.els)a.play().catch(()=>{});
    if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Drone '+nm(dMidi()),artist:'Pitch Track'});}catch(e){}}}
  if(view==='drone')droneDraw();}));
$('dVol').addEventListener('input',dVolApply);
$('dVol').addEventListener('change',()=>{ST.d_dVol=$('dVol').value;saveST();});
$('dTimer').addEventListener('change',()=>{ST.d_dTimer=$('dTimer').value;saveST();});
$('dHold').addEventListener('change',()=>{ST.d_dHold=$('dHold').value;saveST();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DR.on){
  for(const a of DR.els)if(a.paused)a.play().catch(()=>{});if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(ST.view==='drone')setView('drone');else {droneStats();droneList();}
</script>
