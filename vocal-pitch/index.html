<title>Нотная дорожка</title>
<style>

:root[data-theme="dark"]{--bg:#14171c;--panel:#1d2128;--grid:#2a2f38;--grid2:#20242b;--text:#e9e6df;--muted:#8b93a1;--accent:#e9a23b;--accent-soft:rgba(233,162,59,.25);--line:#f4f4f4;--good:#46b36d;--flat:#5b8def;--sharp:#e5544d;--btn:#e9e6df;--btnfg:#14171c;--chip:#252a33}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;padding:10px 16px;padding-block:10px;display:flex;flex-direction:column;gap:10px;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em}
h1 small{color:var(--muted);font-weight:400;margin-left:6px}
label.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
select,input[type=range]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:5px 8px}
input[type=range]{width:90px;padding:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.ghost{background:var(--chip);color:var(--text)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:relative;flex:1;min-height:300px;background:var(--panel);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#live{position:absolute;right:12px;top:10px;font-size:22px;font-weight:700;padding:4px 12px;border-radius:10px;background:var(--chip);min-width:74px;text-align:center}
#meter{position:absolute;left:12px;bottom:10px;width:120px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--good)}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:20px;color:var(--muted);pointer-events:none}
#lyrics{display:none}
#lyrics b{color:var(--accent)}
#result{display:none;flex-direction:column;gap:8px;padding:10px 12px;background:var(--panel);border-radius:14px}
#result.show{display:flex}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.stats b{color:var(--text);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 7px;border-radius:7px;font-size:13px;line-height:1.15;text-align:center;background:var(--chip)}
.chip small{display:block;font-size:10px;opacity:.85}
#scrubrow{display:flex;align-items:center;gap:8px}
#scrubrow[hidden]{display:none}
#scrubrow input[type=range]{flex:1;width:auto}
#scrubrow span{color:var(--muted);font-size:13px;min-width:56px;text-align:right}
#scrubrow button{padding:6px 12px}
.chip{cursor:pointer}
.chip.cur{outline:2px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style></head><body>
<header>

  // голос
  let cur=null,curTg=null;
  if(review){for(let i=0;i<samples.length;i++){const s=samples[i];const x=px+(s.t-t)*PPS;if(x<0||x>px+2)continue;if(s.tg===undefined)assign(s);const tg=s.tg;const m=fold(s.m,tg?tg.midi:null);
    const c=tg?(m-tg.midi)*100:null;ctx.fillStyle=c==null?getVar('--muted'):colorFor(c);ctx.fillRect(x-1.5,y(m)-2,3,4);if(t-s.t<0.12){cur=c;curTg=tg;}}}
  else{ // комета: сглаженный хвост ~0.7 с + голова на линии
    const tail=[];for(let i=samples.length-1;i>=0;i--){const s=samples[i];if(t-s.t>0.7)break;tail.push(s);}
    tail.reverse();for(const s of tail)if(s.tg===undefined)assign(s); /* цели назначаются строго по времени, иначе удержание прежней цели идёт задом наперёд */
    if(tail.length){const last=tail[tail.length-1];const tg=last.tg;const mh=fold(last.m,tg?tg.midi:null);
      // сглаживание: медиана последних 5 точек
      const sm=i=>{const a=[];for(let k=Math.max(0,i-4);k<=i;k++)a.push(fold(tail[k].m,tg?tg.midi:null));a.sort((p,q)=>p-q);return a[Math.floor(a.length/2)];};
      const c=tg?(sm(tail.length-1)-tg.midi)*100:null;const col=c==null?getVar('--muted'):colorFor(c);
      for(let i=1;i<tail.length;i++){const s=tail[i],pv=tail[i-1];if(s.t-pv.t>0.15)continue;const k=i/tail.length;ctx.strokeStyle=col;ctx.globalAlpha=0.15+0.75*k;ctx.lineWidth=1+9*k;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px+(pv.t-t)*PPS,y(sm(i-1)));ctx.lineTo(px+(s.t-t)*PPS,y(sm(i)));ctx.stroke();}
      ctx.globalAlpha=1;if(t-last.t<0.15){const yy=y(sm(tail.length-1));ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,yy,8,0,Math.PI*2);ctx.fill();ctx.fillStyle=getVar('--text');ctx.font='600 13px -apple-system,sans-serif';ctx.textBaseline='middle';ctx.fillText(nm(Math.round(mh)).replace(/\d/,''),px+13,yy);cur=c;curTg=tg;}}}
  // линия воспроизведения
  ctx.strokeStyle=getVar('--line');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();
  const mt=$('meter').firstElementChild;const db=20*Math.log10(lastRms+1e-6);mt.style.width=Math.max(0,Math.min(100,(db+60)/60*100))+'%';mt.style.background=lastRms<0.003?getVar('--muted'):getVar('--good');
  // живое отклонение + какая нота должна быть
  const lv=$('live');if(cur==null){lv.textContent='—';lv.style.color=getVar('--muted');}else{lv.textContent=(curTg?curTg.syl.replace(/^-/,'')+' '+nm(curTg.midi).replace(/\d/,''):'')+(Math.abs(cur)<=10?' ✓':(cur<0?' ↓':' ↑'));lv.style.color=colorFor(cur);}
  // текст строки
  const tg=targetAt(Math.max(t,0));const ln=tg?tg.line:(events.find(e=>e.t>t)||{}).line;
  if(ln){const parts=events.filter(e=>e.line===ln);let html='';for(const p of parts){const s=p.syl.replace(/^-/,'').replace(/-$/,'');const sep=p.syl.startsWith('-')?'':' ';html+=sep+(p===tg?'<b>'+s+'</b>':s);}$('lyrics').innerHTML=html.trim();}
}
function score(){const chips=$('chips');chips.innerHTML='';const errs=[];
  for(const s of samples)if(s.tg===undefined)assign(s);
  for(const e of events){const c=medC(e);const el=document.createElement('span');el.className='chip';el.onclick=()=>{if(review)setRT(e.t);};e.chip=el;const s=e.syl.replace(/^-/,'').replace(/-$/,'');
    if(c==null){el.innerHTML=s+'<small>·</small>';}else{errs.push(c);const col=colorFor(c);el.style.background=col+'33';el.style.color=col;el.innerHTML=s+'<small>'+(Math.abs(c)<=10?'✓':(c<0?'↓':'↑'))+'</small>';}
    chips.appendChild(el);}
  const n=errs.length;$('rN').textContent=n+'/'+events.length;
  if(n){$('rIn10').textContent=Math.round(100*errs.filter(c=>Math.abs(c)<=10).length/n)+'%';$('rIn25').textContent=Math.round(100*errs.filter(c=>Math.abs(c)<=25).length/n)+'%';$('rLow').textContent=Math.round(100*errs.filter(c=>c<-10).length/n)+'%';$('rHigh').textContent=Math.round(100*errs.filter(c=>c>10).length/n)+'%';}
  else{$('rIn10').textContent='—';$('rIn25').textContent='—';$('rLow').textContent='—';$('rHigh').textContent='—';}
  $('result').classList.add('show');$('msg').textContent=n?'':'Голоса не слышно — проверь микрофон.';}
// просмотр после пения: перемотка
function setRT(v){rt=Math.max(0,Math.min(total,v));$('scrub').value=total?Math.round(rt/total*1000):0;$('scrubT').textContent=rt.toFixed(1)+' с';
  const tg=targetAt(rt);for(const e of events)if(e.chip)e.chip.classList.toggle('cur',e===tg);draw(rt);}
function stepSyl(dir){const ts=events.map(e=>e.t);let v;if(dir>0)v=ts.find(x=>x>rt+0.05);else{const p=ts.filter(x=>x<rt-0.05);v=p.length?p[p.length-1]:0;}if(v==null)v=total;setRT(v);}
$('scrub').addEventListener('input',()=>setRT(+$('scrub').value/1000*total));
$('prev').onclick=()=>stepSyl(-1);$('next').onclick=()=>stepSyl(1);
(function(){let dx=null,r0=0;const st=$('stage');
  st.addEventListener('pointerdown',e=>{if(!review)return;dx=e.clientX;r0=rt;st.setPointerCapture(e.pointerId);});
  st.addEventListener('pointermove',e=>{if(dx==null)return;setRT(r0-(e.clientX-dx)/PPS);});
  const up=()=>{dx=null;};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);})();
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();
  if(e.code==='Space'){e.preventDefault();if(document.activeElement)document.activeElement.blur();if(running||testing)stop(false);else start();return;}
  if(!review||tag==='select'||tag==='input')return;
  if(e.code==='ArrowLeft'){e.preventDefault();e.shiftKey?setRT(rt-0.25):stepSyl(-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();e.shiftKey?setRT(rt+0.25):stepSyl(1);}
  else if(e.code==='Home'){e.preventDefault();setRT(0);}else if(e.code==='End'){e.preventDefault();setRT(total);}});
resize();listMics();
</script>
